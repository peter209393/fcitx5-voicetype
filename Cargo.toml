[package]
name = "fcitx5-voicetype"
version = "0.2.0"
edition = "2021"
description = "Core of the fcitx5-voicetype addon: microphone capture + 豆包 streaming ASR"
license = "MIT"

[lib]
name = "voice_type_core"
crate-type = ["staticlib", "rlib"]

[dependencies]
anyhow = "1"
cpal = "0.15"
flate2 = "1"
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "macros", "time", "net", "sync"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
uuid = { version = "1", features = ["v4"] }
